<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Page</title>
    <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
        }
        .hidden {
            display: none;
        }
        .button {
            width: 150px;
            height: 50px;
            margin: 10px;
            font-size: 16px;
            cursor: pointer;
        }
        .pending {
            background-color: lightblue;
        }
        .in-progress {
            background-color: orange;
        }
        .attending {
            background-color: green;
        }
    </style>
</head>
<body>
    <div id="login-container">
        <h1>Login</h1>
        <button onclick="login('solicitante')">Solicitante</button>
        <button onclick="login('atendente')">Atendente</button>
    </div>

    <div id="solicitante-container" class="hidden">
        <h2>Solicitante</h2>
        <div id="buttons-container">
            <!-- Buttons will be dynamically added here -->
        </div>
    </div>

    <div id="atendente-container" class="hidden">
        <h2>Atendente</h2>
        <div id="buttons-container-atendente">
            <!-- Buttons will be dynamically added here -->
        </div>
    </div>

    <script>
        const socket = io('http://localhost:3000');

        const loginContainer = document.getElementById('login-container');
        const solicitanteContainer = document.getElementById('solicitante-container');
        const atendenteContainer = document.getElementById('atendente-container');
        const buttonsContainer = document.getElementById('buttons-container');
        const buttonsContainerAtendente = document.getElementById('buttons-container-atendente');

        let role = '';

        function login(userRole) {
            role = userRole;
            loginContainer.classList.add('hidden');

            if (role === 'solicitante') {
                solicitanteContainer.classList.remove('hidden');
                createSolicitanteButtons();
            } else if (role === 'atendente') {
                atendenteContainer.classList.remove('hidden');
            }
        }

        function createSolicitanteButtons() {
            for (let i = 0; i < 10; i++) {
                const button = document.createElement('button');
                button.className = 'button';
                button.textContent = `Botão ${i + 1}`;
                button.onclick = () => openSolicitantePopup(i);
                buttonsContainer.appendChild(button);
            }
        }

        function openSolicitantePopup(index) {
            const choices = ['Trama', 'Urdume', 'Retirada de bobina', 'Tubetes vazios'];
            const choice = prompt(`Escolha uma opção para o Botão ${index + 1}:\n${choices.join('\n')}`);

            if (choices.includes(choice)) {
                const button = buttonsContainer.children[index];
                button.className = 'button in-progress';
                socket.emit('updateStatus', { index, status: 'in-progress' });
            }
        }

        socket.on('updateStatus', ({ index, status }) => {
            if (role === 'atendente') {
                let button = buttonsContainerAtendente.children[index];
                if (!button) {
                    button = document.createElement('button');
                    button.className = 'button';
                    button.textContent = `Botão ${index + 1}`;
                    button.onclick = () => openAtendentePopup(index);
                    buttonsContainerAtendente.appendChild(button);
                }
                button.className = `button ${status}`;
            }
        });

        function openAtendentePopup(index) {
            const confirm = window.confirm('Deseja atender?');
            if (confirm) {
                const button = buttonsContainerAtendente.children[index];
                button.className = 'button attending';
                startTimer(button);
                socket.emit('updateStatus', { index, status: 'attending' });
            }
        }

        function startTimer(button) {
            let seconds = 0;
            const timer = setInterval(() => {
                seconds++;
                button.textContent = `Em atendimento (${seconds}s)`;
            }, 1000);

            button.dataset.timer = timer;
        }

        if (role === 'solicitante') {
            socket.on('finalize', (index) => {
                const button = buttonsContainer.children[index];
                button.className = 'button';
                button.textContent = `Botão ${index + 1}`;
            });
        }

        if (role === 'atendente') {
            socket.on('finalize', (index) => {
                const button = buttonsContainerAtendente.children[index];
                clearInterval(button.dataset.timer);
                button.className = 'button';
                button.textContent = `Botão ${index + 1}`;
            });
        }

        function finalize(index) {
            socket.emit('finalize', index);
        }
    </script>
</body>
</html>

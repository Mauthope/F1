<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shared Page</title>
    <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
        }
        .hidden {
            display: none;
        }
        .button {
            width: 150px;
            height: 50px;
            margin: 10px;
            font-size: 16px;
            cursor: pointer;
        }
        .pending {
            background-color: lightblue;
        }
        .in-progress {
            background-color: orange;
        }
        .attending {
            background-color: green;
        }
    </style>
</head>
<body>
    <div id="login-container">
        <h1>Login</h1>
        <button onclick="login('solicitante')">Solicitante</button>
        <button onclick="login('atendente')">Atendente</button>
    </div>

    <div id="main-container" class="hidden">
        <h2 id="role-title"></h2>
        <div id="buttons-container">
            <!-- Buttons will be dynamically added here -->
        </div>
    </div>

    <script>
        const socket = io('http://localhost:3000');

        const loginContainer = document.getElementById('login-container');
        const mainContainer = document.getElementById('main-container');
        const roleTitle = document.getElementById('role-title');
        const buttonsContainer = document.getElementById('buttons-container');

        let role = '';

        function login(userRole) {
            role = userRole;
            loginContainer.classList.add('hidden');
            mainContainer.classList.remove('hidden');
            roleTitle.textContent = role === 'solicitante' ? 'Solicitante' : 'Atendente';

            if (role === 'solicitante') {
                createButtonsForSolicitante();
            } else if (role === 'atendente') {
                socket.emit('requestButtons');
            }
        }

        function createButtonsForSolicitante() {
            for (let i = 0; i < 10; i++) {
                const button = document.createElement('button');
                button.className = 'button';
                button.textContent = `Botão ${i + 1}`;
                button.onclick = () => openSolicitantePopup(i);
                buttonsContainer.appendChild(button);
            }
        }

        function openSolicitantePopup(index) {
            const choices = ['Trama', 'Urdume', 'Retirada de bobina', 'Tubetes vazios'];
            const choice = prompt(`Escolha uma opção para o Botão ${index + 1}:\n${choices.join('\n')}`);

            if (choices.includes(choice)) {
                const button = buttonsContainer.children[index];
                button.className = 'button in-progress';
                socket.emit('updateStatus', { index, status: 'in-progress' });
            }
        }

        socket.on('updateStatus', ({ index, status }) => {
            let button = buttonsContainer.children[index];
            if (!button) {
                button = document.createElement('button');
                button.className = 'button';
                button.textContent = `Botão ${index + 1}`;
                buttonsContainer.appendChild(button);
            }
            button.className = `button ${status}`;

            if (role === 'atendente' && status === 'in-progress') {
                button.onclick = () => openAtendentePopup(index);
            }
        });

        function openAtendentePopup(index) {
            const confirm = window.confirm('Deseja atender?');
            if (confirm) {
                const button = buttonsContainer.children[index];
                button.className = 'button attending';
                startTimer(button);
                socket.emit('updateStatus', { index, status: 'attending' });
            }
        }

        function startTimer(button) {
            let seconds = 0;
            const timer = setInterval(() => {
                seconds++;
                button.textContent = `Em atendimento (${seconds}s)`;
            }, 1000);

            button.dataset.timer = timer;
        }

        socket.on('finalize', (index) => {
            const button = buttonsContainer.children[index];
            clearInterval(button.dataset.timer);
            button.className = 'button';
            button.textContent = `Botão ${index + 1}`;
        });

        function finalize(index) {
            socket.emit('finalize', index);
        }
    </script>
</body>
</html>
